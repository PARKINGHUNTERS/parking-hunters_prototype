<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>대구 주차 도우미 — 클릭 프로토타입</title>
<style>
  :root {
    --bg: #15161A;
    --surface: #1E2025;
    --surface-alt: #23262C;
    --border: #2E313A;
    --text-primary: #F3F4F6;
    --text-secondary: #9AA0AC;
    --accent: #4C8DFF;

    --avail-bg: #1E3B2A; --avail-fg: #54D686;
    --normal-bg: #3B2E14; --normal-fg: #E0A63C;
    --crowd-bg: #3B1E22; --crowd-fg: #E05C6B;
    --full-bg: #3B1420;  --full-fg: #E0405C;
    --unsup-bg: #2A2D33; --unsup-fg: #9AA0AC;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    background: #0b0c0e;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    color: var(--text-primary);
  }

  /* 폰 프레임 (데스크톱에서도 모바일 프로토타입처럼 보이게) */
  .phone-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 0;
  }
  .phone {
    width: 390px;
    max-width: 100vw;
    height: 780px;
    max-height: 92vh;
    background: var(--bg);
    border-radius: 36px;
    box-shadow: 0 30px 60px rgba(0,0,0,0.5), 0 0 0 1px #000;
    overflow: hidden;
    position: relative;
  }
  @media (max-width: 420px) {
    .phone { border-radius: 0; height: 100vh; max-height: 100vh; }
    .phone-wrap { padding: 0; }
  }

  .screen {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    overflow-y: auto;
    background: var(--bg);
    animation: slideIn 220ms ease;
  }
  .screen.active { display: flex; }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .safe-top { height: 18px; flex: 0 0 auto; }
  .content { padding: 0 20px 24px; flex: 1; }

  h1.app-title {
    font-size: 21px;
    font-weight: 800;
    margin: 4px 0 16px;
  }

  .search-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    cursor: pointer;
    color: var(--text-secondary);
    font-size: 15px;
    user-select: none;
  }
  .search-bar svg { flex: 0 0 auto; opacity: .8; }
  .search-bar:active { background: var(--surface-alt); }

  .section-label {
    font-size: 15px;
    font-weight: 700;
    margin: 22px 0 12px;
  }

  .lot-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px 18px;
    margin-bottom: 12px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    cursor: pointer;
    transition: background 120ms ease, transform 80ms ease;
  }
  .lot-card:active { background: var(--surface-alt); transform: scale(0.99); }
  .lot-main .lot-name { font-size: 16px; font-weight: 700; margin: 0 0 6px; }
  .lot-main .lot-sub { font-size: 13px; color: var(--text-secondary); }

  .badge {
    flex: 0 0 auto;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 700;
    white-space: nowrap;
  }
  .badge.available { background: var(--avail-bg); color: var(--avail-fg); }
  .badge.normal    { background: var(--normal-bg); color: var(--normal-fg); }
  .badge.crowded   { background: var(--crowd-bg); color: var(--crowd-fg); }
  .badge.full      { background: var(--full-bg); color: var(--full-fg); }
  .badge.unsupported { background: var(--unsup-bg); color: var(--unsup-fg); }

  /* 상단 바 (뒤로가기 + 타이틀) */
  .topbar {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 4px 20px 0;
    flex: 0 0 auto;
  }
  .back-btn {
    width: 34px; height: 34px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%;
    cursor: pointer;
    color: var(--text-primary);
    background: transparent;
    border: none;
  }
  .back-btn:active { background: var(--surface-alt); }

  /* 검색 화면 */
  .search-input-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 16px;
    margin-top: 8px;
  }
  .search-input-wrap input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text-primary);
    font-size: 15px;
    font-family: inherit;
  }
  .search-input-wrap input::placeholder { color: var(--text-secondary); }

  .chip-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
  .chip {
    background: var(--surface-alt);
    border-radius: 20px;
    padding: 9px 14px;
    font-size: 13px;
    cursor: pointer;
    user-select: none;
  }
  .chip:active { background: var(--border); }

  .primary-btn {
    width: 100%;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 14px;
    padding: 16px;
    font-size: 16px;
    font-weight: 700;
    margin-top: 22px;
    cursor: pointer;
    font-family: inherit;
  }
  .primary-btn:active { opacity: .85; }
  .primary-btn[disabled] { opacity: .5; cursor: default; }

  /* 검색 결과 화면 */
  .eta-row {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--accent);
    font-size: 15px;
    font-weight: 700;
    margin: 4px 0 6px;
  }
  .place-name { font-size: 22px; font-weight: 800; margin: 0 0 18px; }

  .nearest-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 18px;
    margin-bottom: 20px;
    cursor: pointer;
  }
  .nearest-card:active { background: var(--surface-alt); }
  .nearest-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .nearest-head .lot-name { font-size: 17px; font-weight: 800; margin: 0 0 6px; }
  .nearest-head .lot-sub { font-size: 13px; color: var(--text-secondary); }

  .mini-map {
    margin-top: 16px;
    height: 130px;
    background: var(--surface-alt);
    border-radius: 14px;
    display: flex;
    align-items: center;
    padding: 0 24px;
  }
  .mini-map .dot-col { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .mini-map .dot { width: 14px; height: 14px; border-radius: 50%; }
  .mini-map .dot.dest { background: var(--accent); }
  .mini-map .dot.lot { background: var(--avail-fg); }
  .mini-map .dot-label { font-size: 12px; color: var(--text-secondary); }
  .mini-map .dash-line {
    flex: 1;
    height: 2px;
    margin: 0 8px 20px;
    background-image: linear-gradient(to right, var(--text-secondary) 0 6px, transparent 6px 11px);
    background-repeat: repeat-x;
    background-size: 11px 2px;
  }
  .walk-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 14px;
    font-size: 14px;
    font-weight: 600;
  }
  .walk-row svg { opacity: .75; }

  /* 상세 화면 */
  .detail-title-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin: 6px 0 6px; }
  .detail-title-row h2 { font-size: 22px; font-weight: 800; margin: 0; }
  .sync-row { display: flex; align-items: center; gap: 6px; color: var(--text-secondary); font-size: 12px; margin-bottom: 22px; }

  .info-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 4px 16px;
    margin-bottom: 16px;
  }
  .info-row {
    display: flex;
    justify-content: space-between;
    padding: 12px 0;
    font-size: 14px;
    border-bottom: 1px solid var(--border);
  }
  .info-row:last-child { border-bottom: none; }
  .info-row .k { color: var(--text-secondary); }
  .info-row .v { font-weight: 700; }

  .card-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--text-secondary);
    margin: 0 0 10px 2px;
  }

  .toast {
    position: absolute;
    left: 50%;
    bottom: 28px;
    transform: translateX(-50%) translateY(12px);
    background: #2A2D33;
    color: var(--text-primary);
    padding: 12px 18px;
    border-radius: 12px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 180ms ease, transform 180ms ease;
    white-space: nowrap;
    z-index: 10;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .hint {
    text-align: center;
    color: var(--text-secondary);
    font-size: 12px;
    margin-top: 18px;
  }
</style>
</head>
<body>

<div class="phone-wrap">
  <div class="phone" id="phone">

    <!-- 화면 1: 홈 -->
    <section class="screen active" id="screen-home">
      <div class="safe-top"></div>
      <div class="content">
        <h1 class="app-title">대구 주차 도우미</h1>
        <div class="search-bar" onclick="goTo('search')">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <span>목적지를 입력하세요</span>
        </div>
        <div class="section-label">현재 위치 주변 주차장</div>
        <div id="home-list"></div>
      </div>
    </section>

    <!-- 화면 2: 검색 -->
    <section class="screen" id="screen-search">
      <div class="safe-top"></div>
      <div class="topbar">
        <button class="back-btn" onclick="goBack()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <span style="font-size:16px;font-weight:700;">목적지 검색</span>
      </div>
      <div class="content">
        <div class="search-input-wrap">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--text-secondary)"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input id="search-input" type="text" placeholder="건물명, 지역명으로 검색" onkeydown="if(event.key==='Enter') doSearch()" />
        </div>
        <div class="section-label" style="margin-top:20px;font-size:13px;color:var(--text-secondary);">추천 목적지</div>
        <div class="chip-row" id="chip-row"></div>
        <button class="primary-btn" onclick="doSearch()">검색</button>
      </div>
    </section>

    <!-- 화면 3: 검색 결과 (목업 재현) -->
    <section class="screen" id="screen-result">
      <div class="safe-top"></div>
      <div class="topbar">
        <button class="back-btn" onclick="goBack()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
      </div>
      <div class="content">
        <div class="eta-row">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l9 18-9-4-9 4 9-18z"/></svg>
          <span>도착 예정 14:32 (18분 후)</span>
        </div>
        <div class="place-name" id="result-place-name">동성로 상점가 부근</div>
        <div id="result-nearest"></div>
        <div id="result-rest"></div>
      </div>
    </section>

    <!-- 화면 4: 상세 정보 -->
    <section class="screen" id="screen-detail">
      <div class="safe-top"></div>
      <div class="topbar">
        <button class="back-btn" onclick="goBack()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
      </div>
      <div class="content" id="detail-content"></div>
    </section>

    <div class="toast" id="toast"></div>
  </div>
</div>

<script>
// ---------------------------------------------------------------------
// 데이터 (PRD 4장 데이터 모델 예시를 그대로 반영한 목(mock) 데이터)
// ---------------------------------------------------------------------
const CONGESTION = {
  available: '여유', normal: '보통', crowded: '혼잡', full: '만차', unsupported: '정보없음'
};

function fee(baseMin, baseFee, addMin, addFee) {
  const won = n => n.toLocaleString('ko-KR') + '원';
  return {
    baseMin, baseFee, addMin, addFee,
    short: `최초 ${baseMin}분 ${won(baseFee)}`,
    full: `최초 ${baseMin}분 ${won(baseFee)} · 이후 ${addMin}분마다 ${won(addFee)}`,
  };
}

const homeLots = [
  { id:'dgu-pub-004', name:'동성로 공영주차장', distanceM:240, available:12, total:86, congestion:'available',
    fee: fee(30,1000,10,500), hours:'24시간', ev:4, disabled:3, synced:'3분 전' },
  { id:'dgu-pub-011', name:'국채보상공원 주차장', distanceM:410, available:5, total:60, congestion:'normal',
    fee: fee(30,1500,10,600), hours:'06:00 ~ 24:00', ev:2, disabled:2, synced:'6분 전' },
  { id:'dgu-priv-021', name:'약전골목 민영주차장', distanceM:520, available:0, total:34, congestion:'crowded',
    fee: fee(60,2000,60,2000), hours:'09:00 ~ 22:00', ev:0, disabled:1, synced:'12분 전' },
  { id:'dgu-priv-034', name:'중앙로 지하주차장', distanceM:680, available:3, total:120, congestion:'available',
    fee: fee(30,1000,15,500), hours:'24시간', ev:6, disabled:4, synced:'5시간 전', realtime:false },
];

const destinationLots = [
  { id:'dgu-pub-004', name:'동성로공영주차장', distanceM:120, available:18, total:86, congestion:'available',
    fee: fee(30,1000,10,500), hours:'24시간', ev:4, disabled:3, synced:'2분 전', walkMin:2 },
  { id:'dgu-pub-011', name:'국채보상공원 주차장', distanceM:280, available:6, total:60, congestion:'normal',
    fee: fee(30,1500,10,600), hours:'06:00 ~ 24:00', ev:2, disabled:2, synced:'6분 전' },
  { id:'dgu-priv-021', name:'약전골목 민영주차장', distanceM:340, available:0, total:34, congestion:'crowded',
    fee: fee(60,2000,60,2000), hours:'09:00 ~ 22:00', ev:0, disabled:1, synced:'15분 전' },
  { id:'dgu-priv-045', name:'서문시장 공영주차타워', distanceM:410, available:22, total:210, congestion:'available',
    fee: fee(30,1000,10,500), hours:'24시간', ev:8, disabled:5, synced:'4분 전' },
  { id:'dgu-priv-052', name:'중앙파출소 부설주차장', distanceM:470, available:1, total:15, congestion:'full',
    fee: fee(60,3000,30,1000), hours:'09:00 ~ 21:00', ev:0, disabled:0, synced:'2시간 전', realtime:false },
];

const SUGGESTIONS = ['동성로', '동대구역', '수성못', '서문시장', '약전골목'];

// ---------------------------------------------------------------------
// 화면 전환 (뒤로가기 스택 포함)
// ---------------------------------------------------------------------
let historyStack = ['home'];

function goTo(screen, opts) {
  opts = opts || {};
  if (opts.replace) { historyStack[historyStack.length - 1] = screen; }
  else { historyStack.push(screen); }
  render(screen, opts);
}

function goBack() {
  if (historyStack.length <= 1) return;
  historyStack.pop();
  render(historyStack[historyStack.length - 1], {});
}

function render(screen) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + screen).classList.add('active');
  document.getElementById('phone').scrollTop = 0;
  const el = document.getElementById('screen-' + screen);
  if (el) el.scrollTop = 0;
}

function lotCardHtml(lot, distancePrefix) {
  return `
    <div class="lot-card" onclick="openDetail('${lot.id}', '${distancePrefix}')">
      <div class="lot-main">
        <p class="lot-name">${lot.name}</p>
        <p class="lot-sub">${distancePrefix} ${lot.distanceM}m · ${lot.fee.short}</p>
      </div>
      <span class="badge ${lot.congestion}">${CONGESTION[lot.congestion]}</span>
    </div>`;
}

function findLot(id) {
  return homeLots.find(l => l.id === id) || destinationLots.find(l => l.id === id);
}

// ---------------------------------------------------------------------
// 화면 1: 홈
// ---------------------------------------------------------------------
function renderHome() {
  document.getElementById('home-list').innerHTML =
    homeLots.map(l => lotCardHtml(l, '현재 위치에서')).join('');
}

// ---------------------------------------------------------------------
// 화면 2: 검색
// ---------------------------------------------------------------------
function renderSearchScreen() {
  document.getElementById('chip-row').innerHTML =
    SUGGESTIONS.map(s => `<span class="chip" onclick="doSearch('${s}')">${s}</span>`).join('');
  document.getElementById('search-input').value = '';
}

function doSearch(presetQuery) {
  const query = presetQuery || document.getElementById('search-input').value.trim();
  if (!query) return;
  document.getElementById('result-place-name').textContent = `${query} 상점가 부근`;
  renderResultScreen();
  goTo('result', { replace: false });
}

// ---------------------------------------------------------------------
// 화면 3: 검색 결과 (목업 그대로)
// ---------------------------------------------------------------------
function renderResultScreen() {
  const nearest = destinationLots[0];
  const rest = destinationLots.slice(1);
  const walkMin = nearest.walkMin || Math.ceil(nearest.distanceM / 80);

  document.getElementById('result-nearest').innerHTML = `
    <div class="nearest-card" onclick="openDetail('${nearest.id}', '목적지에서')">
      <div class="nearest-head">
        <div>
          <p class="lot-name">${nearest.name}</p>
          <p class="lot-sub">목적지에서 ${nearest.distanceM}m · ${nearest.fee.short}</p>
        </div>
        <span class="badge ${nearest.congestion}">${CONGESTION[nearest.congestion]}</span>
      </div>
      <div class="mini-map">
        <div class="dot-col"><div class="dot dest"></div><span class="dot-label">목적지</span></div>
        <div class="dash-line"></div>
        <div class="dot-col"><div class="dot lot"></div><span class="dot-label">주차장</span></div>
      </div>
      <div class="walk-row">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="13" cy="4" r="2"/><path d="M15 22l-1-6-3-2 1-5-3 2-1-3 5-2 2 3h3"/></svg>
        <span>도보 ${walkMin}분 · 우측 방향으로 ${nearest.distanceM}m</span>
      </div>
    </div>`;

  document.getElementById('result-rest').innerHTML =
    rest.map(l => lotCardHtml(l, '목적지에서')).join('');
}

// ---------------------------------------------------------------------
// 화면 4: 상세 정보
// ---------------------------------------------------------------------
function openDetail(id, distancePrefix) {
  const lot = findLot(id);
  if (!lot) return;
  const syncedText = lot.realtime === false
    ? '실시간 정보 미지원 · 기본 정보 제공'
    : `최근 갱신: ${lot.synced}`;

  document.getElementById('detail-content').innerHTML = `
    <div class="detail-title-row">
      <h2>${lot.name}</h2>
      <span class="badge ${lot.congestion}">${CONGESTION[lot.congestion]}</span>
    </div>
    <div class="sync-row">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 6v6l4 2"/><circle cx="12" cy="12" r="9"/></svg>
      <span>${syncedText}</span>
    </div>

    <p class="card-title">기본 정보</p>
    <div class="info-card">
      <div class="info-row"><span class="k">여유 차석 / 전체</span><span class="v">${lot.available} / ${lot.total}면</span></div>
      <div class="info-row"><span class="k">운영시간</span><span class="v">${lot.hours}</span></div>
      <div class="info-row"><span class="k">거리</span><span class="v">${lot.distanceM}m</span></div>
    </div>

    <p class="card-title">요금</p>
    <div class="info-card">
      <div class="info-row"><span class="k">기본</span><span class="v" style="text-align:right;max-width:60%;">${lot.fee.full}</span></div>
    </div>

    <p class="card-title">전용 구역</p>
    <div class="info-card">
      <div class="info-row"><span class="k">전기차 충전 구역</span><span class="v">${lot.ev}면</span></div>
      <div class="info-row"><span class="k">장애인 전용 구역</span><span class="v">${lot.disabled}면</span></div>
    </div>

    <button class="primary-btn" onclick="showToast('외부 내비게이션 연동은 추후 구현됩니다')">길찾기</button>
    <p class="hint">↑ 프로토타입에서는 토스트만 표시됩니다</p>
  `;
  goTo('detail');
}

// ---------------------------------------------------------------------
// 토스트
// ---------------------------------------------------------------------
let toastTimer = null;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
}

// ---------------------------------------------------------------------
// 초기화
// ---------------------------------------------------------------------
renderHome();
renderSearchScreen();
renderResultScreen();
</script>
</body>
</html>
